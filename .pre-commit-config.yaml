repos:
  # ── General file hygiene ────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key     # blocks private keys hardcoded in files

  # ── Secret detection (Gitleaks) ────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # ── Python SAST (Bandit) ────────────────────────────────────────────────
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        name: bandit (api)
        args:
          - "-r"
          - "servicios/api/app"
          - "--severity-level"
          - "medium"
          - "--confidence-level"
          - "medium"
        pass_filenames: false
      - id: bandit
        name: bandit (worker)
        args:
          - "-r"
          - "servicios/worker/app"
          - "--severity-level"
          - "medium"
          - "--confidence-level"
          - "medium"
        pass_filenames: false
