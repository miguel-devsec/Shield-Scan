name: ShieldScan CI/CD Pipeline

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  API_IMAGE: migueldevsec/shieldscan-api
  WORKER_IMAGE: migueldevsec/shieldscan-worker
  FRONTEND_IMAGE: migueldevsec/shieldscan-frontend

jobs:

  # -----------------------------------------------------------------------
  # 1. Security — scan the full git history for leaked secrets
  # -----------------------------------------------------------------------
  secrets-scan:
    name: "Security — Secrets Detection (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # -----------------------------------------------------------------------
  # 2. Build → Scan → Push  (runs in parallel for each service)
  #    - Builds the Docker image
  #    - Scans it with Trivy (fails on CRITICAL CVEs)
  #    - Pushes to Docker Hub only on pushes to main
  # -----------------------------------------------------------------------
  build-scan-push:
    name: "Build, Scan & Push — ${{ matrix.service.name }}"
    runs-on: ubuntu-latest
    needs: secrets-scan
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api
            context: ./servicios/api
            image: migueldevsec/shieldscan-api
          - name: worker
            context: ./servicios/worker
            image: migueldevsec/shieldscan-worker
          - name: frontend
            context: ./servicios/frontend
            image: migueldevsec/shieldscan-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build locally so Trivy can scan the image before it is pushed
      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: false
          tags: ${{ matrix.service.image }}:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      # Security gate — pipeline fails if any CRITICAL CVE is found
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ matrix.service.image }}:scan
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: false

      # Push only when merging / pushing to main
      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Set version tag
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: echo "VERSION=v$(date +'%Y%m%d-%H%M')" >> "$GITHUB_ENV"

      - name: Push to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: |
            ${{ matrix.service.image }}:${{ env.VERSION }}
            ${{ matrix.service.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
