global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: shieldscan
    env: local

scrape_configs:
  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # ShieldScan API — exposes /metrics via prometheus-fastapi-instrumentator
  - job_name: shieldscan-api
    static_configs:
      - targets: ['api:8000']
    metrics_path: /metrics
